name: P2.1c.2d.1 Transaction Fence Gate
on:
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', 'database/**', '.github/workflows/p2-1c2d1-write-fence.yml']
  pull_request:
    paths: ['backend/**', 'contracts/**', 'database/**', '.github/workflows/p2-1c2d1-write-fence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: echo_fence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_fence_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: echo_test
      PGPASSWORD: disposable_ci_only
      PGDATABASE: echo_fence_test
      ECHO_DISPOSABLE_PG: 'YES'
      PYTHONPATH: backend/p2_1c2b1:backend/p2_1c2c3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare disposable runtimes and source manifest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install -r backend/p2_1c2c3/requirements.txt
          mkdir -p verification/p2_1c2d1
          git rev-parse HEAD | tee verification/p2_1c2d1/checkout-sha.txt
          git ls-files -z backend contracts database .github/workflows/p2-1c2d1-write-fence.yml | xargs -0 sha256sum > verification/p2_1c2d1/source-sha256.txt
          python --version | tee verification/p2_1c2d1/python.txt
          node --version | tee verification/p2_1c2d1/node.txt
          psql -X -Atc 'SELECT version();' | tee verification/p2_1c2d1/postgres.txt
          psql -X -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE echo_session_test;'
          psql -X -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE echo_signed_registry_test;'
      - name: Original schema history and public-read regressions
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f database/p2_1b/tests_postgres.sql 2>&1 | tee verification/p2_1c2d1/schema.txt
          psql -X -v ON_ERROR_STOP=1 -f database/p2_1c/tests_postgres.sql 2>&1 | tee verification/p2_1c2d1/history.txt
          psql -X -v ON_ERROR_STOP=1 -f database/p2_1c2a/tests_postgres.sql 2>&1 | tee verification/p2_1c2d1/public-read.txt
      - name: Original signed verifier and command regressions
        run: |
          set -euo pipefail
          ECHO_IDENTITY_RESULTS=verification/p2_1c2d1/verifier python backend/p2_1c2b1/run_checks.py 2>&1 | tee verification/p2_1c2d1/verifier.txt
          node --test contracts/p2_1c2b/command_boundary.test.mjs 2>&1 | tee verification/p2_1c2d1/commands.txt
      - name: Original durable registry regressions
        run: |
          set -euo pipefail
          node --test contracts/p2_1c2c/session_boundary.test.mjs 2>&1 | tee verification/p2_1c2d1/session-unit.txt
          PGDATABASE=echo_session_test node --test contracts/p2_1c2c/postgres_mapping.test.mjs 2>&1 | tee verification/p2_1c2d1/session-postgres.txt
          grep -q 'CLEAN_ISOLATED_IDENTITY_DATABASE' verification/p2_1c2d1/session-postgres.txt
      - name: Original real signed-registry integration regression
        env:
          PGDATABASE: echo_signed_registry_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f database/p2_1b/schema.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f database/p2_1c2c/001_identity_registry.sql
          python -m unittest -v backend/p2_1c2c3/test_signed_registry_integration.py 2>&1 | tee verification/p2_1c2d1/signed-registry.txt
          grep -q '^OK$' verification/p2_1c2d1/signed-registry.txt
      - name: Real transaction fence and observed revocation races
        run: |
          set -euo pipefail
          python -m py_compile database/p2_1c2d1/test_write_fence.py
          python database/p2_1c2d1/test_write_fence.py 2>&1 | tee verification/p2_1c2d1/fence.txt
          grep -q 'Ran 29 tests' verification/p2_1c2d1/fence.txt
          grep -q '^OK$' verification/p2_1c2d1/fence.txt
          grep -q 'CLEAN_WRITE_FENCE_DATABASE' verification/p2_1c2d1/fence.txt
      - name: Cleanup isolated signed-registry schema
        if: always()
        env:
          PGDATABASE: echo_signed_registry_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS echo_identity CASCADE; DROP SCHEMA IF EXISTS echo_core CASCADE;' 2>&1 | tee verification/p2_1c2d1/signed-cleanup.txt
          test "$(psql -X -Atc "SELECT to_regnamespace('echo_identity') IS NULL AND to_regnamespace('echo_core') IS NULL")" = t
      - name: Retain actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d1-transaction-fence-evidence
          path: verification/p2_1c2d1/
          if-no-files-found: warn
