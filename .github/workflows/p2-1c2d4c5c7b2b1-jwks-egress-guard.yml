name: P2.1c.2d.4c.5c.7b.2b.1 JWKS Egress Guard Gate

on:
  push:
    branches: [main]
    paths:
      - 'backend/p2_1c2d4c5c7a/**'
      - 'backend/p2_1c2d4c5c7b2a/**'
      - 'backend/p2_1c2d4c5c7b2b1/**'
      - '.github/workflows/p2-1c2d4c5c7b2b1-jwks-egress-guard.yml'
  pull_request:
    paths:
      - 'backend/p2_1c2d4c5c7a/**'
      - 'backend/p2_1c2d4c5c7b2a/**'
      - 'backend/p2_1c2d4c5c7b2b1/**'
      - '.github/workflows/p2-1c2d4c5c7b2b1-jwks-egress-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jwks-egress-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source and runtime
        run: |
          set -euo pipefail
          mkdir -p verification/p2_1c2d4c5c7b2b1
          git rev-parse HEAD | tee verification/p2_1c2d4c5c7b2b1/checkout-sha.txt
          python --version | tee verification/p2_1c2d4c5c7b2b1/python.txt
          sha256sum \
            backend/p2_1c2d4c5c7a/jwks_trust_contract.py \
            backend/p2_1c2d4c5c7a/test_jwks_trust_contract.py \
            backend/p2_1c2d4c5c7b2a/jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2a/test_jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2b1/README_TH.md \
            backend/p2_1c2d4c5c7b2b1/jwks_egress_guard.py \
            backend/p2_1c2d4c5c7b2b1/test_jwks_egress_guard.py \
            | tee verification/p2_1c2d4c5c7b2b1/source-sha256.txt
      - name: Execute inherited and egress contracts
        env:
          PYTHONPATH: backend/p2_1c2d4c5c7a:backend/p2_1c2d4c5c7b2a:backend/p2_1c2d4c5c7b2b1
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/p2_1c2d4c5c7a/jwks_trust_contract.py \
            backend/p2_1c2d4c5c7b2a/jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2b1/jwks_egress_guard.py \
            backend/p2_1c2d4c5c7b2b1/test_jwks_egress_guard.py
          python backend/p2_1c2d4c5c7a/test_jwks_trust_contract.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b1/trust-contract-tests.txt
          grep -q 'Ran 20 tests' verification/p2_1c2d4c5c7b2b1/trust-contract-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b1/trust-contract-tests.txt
          python backend/p2_1c2d4c5c7b2a/test_jwks_https_transport_contract.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b1/http-envelope-tests.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5c7b2b1/http-envelope-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b1/http-envelope-tests.txt
          python backend/p2_1c2d4c5c7b2b1/test_jwks_egress_guard.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b1/egress-guard-tests.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5c7b2b1/egress-guard-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b1/egress-guard-tests.txt
      - name: Retain egress-guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d4c5c7b2b1-jwks-egress-guard-evidence
          path: verification/p2_1c2d4c5c7b2b1/
          if-no-files-found: warn
