name: Thai News Source Probe
on:
  pull_request:
    paths: ['.github/workflows/thai-news-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe bounded public feed responses
        run: |
          mkdir -p verification
          python - <<'PY'
          import urllib.request, urllib.parse, json, re, xml.etree.ElementTree as ET
          urls = [
            'https://www.infoquest.co.th/feed',
            'https://www.infoquest.co.th/category/general/feed',
            'https://www.infoquest.co.th/category/politics/feed',
            'https://www.infoquest.co.th/category/economy/feed',
            'https://www.thailand.go.th/useful-rss',
            'https://www.thailand.go.th/rss',
            'https://www.doh.go.th/index.php/rss',
          ]
          results=[]
          for url in urls:
            record={'url':url}
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'EchoNews-FeedCheck/1.0 (+https://github.com/nustanakritwithai/Echonews)','Accept':'application/rss+xml, application/xml, text/xml, text/html'})
              with urllib.request.urlopen(request,timeout=12) as response:
                raw=response.read(1500000)
                record.update(status=response.status,final_url=response.url,bytes=len(raw),type=response.headers.get('Content-Type'))
              try:
                root=ET.fromstring(raw)
                items=root.findall('.//item')
                record.update(root=root.tag,items=len(items),sample=[{'title':i.findtext('title','')[:100],'url':i.findtext('link'),'date':i.findtext('pubDate'),'categories':[e.text for e in i.findall('category')]} for i in items[:2]])
              except ET.ParseError:
                text=raw.decode('utf-8',errors='replace')
                record['feed_links']=list(dict.fromkeys(re.findall(r'href=[\"\x27]([^\"\x27]*(?:feed|rss)[^\"\x27]*)',text,re.I)))[:20]
            except Exception as error:
              record['error']=str(error)[:200]
            results.append(record)
          print(json.dumps(results,ensure_ascii=False,indent=2))
          open('verification/news-sources.json','w').write(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thai-news-source-probe
          path: verification/news-sources.json
