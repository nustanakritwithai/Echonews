name: Activation Replay and Audit Gate
on:
  push:
    branches: [main]
    paths: ['backend/p2_1c2d4c5c2/**', 'database/p2_1c2d4c5c2/**', '.github/workflows/p2-1c2d4c5c2-replay.yml']
  pull_request:
    paths: ['backend/p2_1c2d4c5c2/**', 'database/p2_1c2d4c5c2/**', '.github/workflows/p2-1c2d4c5c2-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: echo_activation_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_activation_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: echo_test
      PGPASSWORD: disposable_ci_only
      PGDATABASE: echo_activation_contract_test
      ECHO_DISPOSABLE_PG: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare runtime and source manifest
        run: |
          set -euo pipefail
          python -m pip install -r backend/p2_1c2d4c5c2/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          mkdir -p verification/activation-replay
          git rev-parse HEAD | tee verification/activation-replay/checkout-sha.txt
          python --version | tee verification/activation-replay/python.txt
          psql -X -Atc 'SELECT version();' | tee verification/activation-replay/postgres.txt
          sha256sum database/p2_1c2d4c5c2/*.sql backend/p2_1c2d4c5c2/*.py .github/workflows/p2-1c2d4c5c2-replay.yml > verification/activation-replay/source-sha256.txt
      - name: Install disposable dependency chain
        run: |
          set -euo pipefail
          for f in database/p2_1b/schema.sql database/p2_1c2c/001_identity_registry.sql database/p2_1c2d4c3/001_registry_service.sql database/p2_1c2d4c4/001_identity_mutation_service.sql database/p2_1c2d4c5a/001_account_link_proof.sql database/p2_1c2d4c5b/001_signed_account_link_service.sql database/p2_1c2d4c5c1/001_signed_principal_service.sql database/p2_1c2d4c5c2/001_activation_contract.sql; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
      - name: Original activation plus observed replay and rollback cases
        run: |
          set -euo pipefail
          python -m unittest -v backend/p2_1c2d4c5c2/test_activation_replay.py 2>&1 | tee verification/activation-replay/tests.txt
          grep -q 'Ran 27 tests' verification/activation-replay/tests.txt
          grep -q '^OK$' verification/activation-replay/tests.txt
          test "$(grep -c 'ACTIVATION_REPLAY_LOCK_OBSERVED' verification/activation-replay/tests.txt)" = 2
          grep -q 'CLEAN_ACTIVATION_CONTRACT_DATABASE' verification/activation-replay/tests.txt
      - name: Independent cleanup assertion
        if: always()
        run: |
          set -euo pipefail
          psql -X -Atc "SELECT to_regnamespace('echo_identity') IS NULL AND to_regnamespace('echo_core') IS NULL AND to_regrole('echo_activation_service') IS NULL AND to_regrole('echo_activation_runtime') IS NULL AND to_regrole('echo_activation_guard') IS NULL" | tee verification/activation-replay/cleanup.txt
          grep -qx t verification/activation-replay/cleanup.txt
      - name: Retain actual replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-replay-evidence
          path: verification/activation-replay/
          if-no-files-found: warn
