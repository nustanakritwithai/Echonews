name: P2.1c.2d.4c.5b Signed Account Link Gate
on:
  push:
    branches: [main]
    paths:
      - 'backend/p2_1c2d4c5b/**'
      - 'database/p2_1c2d4c5b/**'
      - '.github/workflows/p2-1c2d4c5b-signed-account-link.yml'
  pull_request:
    paths:
      - 'backend/p2_1c2d4c5b/**'
      - 'database/p2_1c2d4c5b/**'
      - '.github/workflows/p2-1c2d4c5b-signed-account-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-account-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: echo_account_link_signed_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_account_link_signed_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: echo_test
      PGPASSWORD: disposable_ci_only
      PGDATABASE: echo_account_link_signed_test
      ECHO_DISPOSABLE_PG: 'YES'
      PYTHONPATH: backend/p2_1c2b1:backend/p2_1c2d4c5b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and capture exact runtime
        run: |
          set -euo pipefail
          python -m pip install -r backend/p2_1c2d4c5b/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          mkdir -p verification/p2_1c2d4c5b
          git rev-parse HEAD | tee verification/p2_1c2d4c5b/checkout-sha.txt
          python --version | tee verification/p2_1c2d4c5b/python.txt
          python - <<'PY' | tee verification/p2_1c2d4c5b/python-packages.txt
          import psycopg, psycopg_pool, jwt
          print('psycopg', psycopg.__version__)
          print('psycopg_pool', psycopg_pool.__version__)
          print('pyjwt', jwt.__version__)
          PY
          psql -X -Atc 'SELECT version();' | tee verification/p2_1c2d4c5b/postgres.txt
          sha256sum \
            database/p2_1c2d4c5b/001_signed_account_link_service.sql \
            backend/p2_1c2d4c5b/account_link_pool.py \
            backend/p2_1c2d4c5b/account_link_boundary.py \
            backend/p2_1c2d4c5b/test_signed_account_link.py \
            backend/p2_1c2d4c5b/README_TH.md \
            | tee verification/p2_1c2d4c5b/source-sha256.txt
      - name: Preserve signed-token parser regression
        run: |
          set -euo pipefail
          ECHO_IDENTITY_RESULTS=verification/p2_1c2d4c5b/token-regression \
            python backend/p2_1c2b1/run_checks.py \
            2>&1 | tee verification/p2_1c2d4c5b/token-regression.txt
      - name: Preserve c5a durable account-link proof regression
        run: |
          set -euo pipefail
          psql -X -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE echo_account_link_proof_test;'
          for f in \
            database/p2_1b/schema.sql \
            database/p2_1c2c/001_identity_registry.sql \
            database/p2_1c2d4c3/001_registry_service.sql \
            database/p2_1c2d4c4/001_identity_mutation_service.sql \
            database/p2_1c2d4c5a/001_account_link_proof.sql; do
            PGDATABASE=echo_account_link_proof_test psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
          PGDATABASE=echo_account_link_proof_test ECHO_DISPOSABLE_PG=YES \
            python -m unittest -v backend/p2_1c2d4c5a/test_account_link_proof.py \
            2>&1 | tee verification/p2_1c2d4c5b/c5a-regression.txt
          grep -q 'Ran 20 tests' verification/p2_1c2d4c5b/c5a-regression.txt
          grep -q '^OK$' verification/p2_1c2d4c5b/c5a-regression.txt
          grep -q 'CLEAN_ACCOUNT_LINK_PROOF_DATABASE' verification/p2_1c2d4c5b/c5a-regression.txt
      - name: Install signed account-link chain
        run: |
          set -euo pipefail
          for f in \
            database/p2_1b/schema.sql \
            database/p2_1c2c/001_identity_registry.sql \
            database/p2_1c2d4c3/001_registry_service.sql \
            database/p2_1c2d4c4/001_identity_mutation_service.sql \
            database/p2_1c2d4c5a/001_account_link_proof.sql \
            database/p2_1c2d4c5b/001_signed_account_link_service.sql; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
      - name: Verify signed account-link service and pool
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/p2_1c2d4c5b/account_link_pool.py \
            backend/p2_1c2d4c5b/account_link_boundary.py \
            backend/p2_1c2d4c5b/test_signed_account_link.py
          python -m unittest -v backend/p2_1c2d4c5b/test_signed_account_link.py \
            2>&1 | tee verification/p2_1c2d4c5b/signed-account-link.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5b/signed-account-link.txt
          grep -q '^OK$' verification/p2_1c2d4c5b/signed-account-link.txt
          grep -q 'CLEAN_SIGNED_ACCOUNT_LINK_DATABASE' verification/p2_1c2d4c5b/signed-account-link.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d4c5b-signed-account-link-evidence
          path: verification/p2_1c2d4c5b/
          if-no-files-found: warn
