name: P2.1c.2d.4c.5a Account Link Proof Gate
on:
  push:
    branches: [main]
    paths:
      - 'backend/p2_1c2d4c5a/**'
      - 'database/p2_1c2d4c5a/**'
      - '.github/workflows/p2-1c2d4c5a-account-link-proof.yml'
  pull_request:
    paths:
      - 'backend/p2_1c2d4c5a/**'
      - 'database/p2_1c2d4c5a/**'
      - '.github/workflows/p2-1c2d4c5a-account-link-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-link-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: echo_account_link_proof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_account_link_proof_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: echo_test
      PGPASSWORD: disposable_ci_only
      PGDATABASE: echo_account_link_proof_test
      ECHO_DISPOSABLE_PG: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and capture exact runtime
        run: |
          set -euo pipefail
          python -m pip install -r backend/p2_1c2d4c4/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          mkdir -p verification/p2_1c2d4c5a
          git rev-parse HEAD | tee verification/p2_1c2d4c5a/checkout-sha.txt
          python --version | tee verification/p2_1c2d4c5a/python.txt
          python - <<'PY' | tee verification/p2_1c2d4c5a/python-packages.txt
          import psycopg
          print('psycopg', psycopg.__version__)
          PY
          psql -X -Atc 'SELECT version();' | tee verification/p2_1c2d4c5a/postgres.txt
          sha256sum \
            database/p2_1c2d4c5a/001_account_link_proof.sql \
            backend/p2_1c2d4c5a/test_account_link_proof.py \
            backend/p2_1c2d4c5a/README_TH.md \
            | tee verification/p2_1c2d4c5a/source-sha256.txt
      - name: Preserve signed-token boundary regression
        run: |
          set -euo pipefail
          ECHO_IDENTITY_RESULTS=verification/p2_1c2d4c5a/token-regression \
            python backend/p2_1c2b1/run_checks.py \
            2>&1 | tee verification/p2_1c2d4c5a/token-regression.txt
      - name: Preserve pre-hardening c4 identity mutation gate
        run: |
          set -euo pipefail
          psql -X -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE echo_identity_mutation_test;'
          for f in \
            database/p2_1b/schema.sql \
            database/p2_1c2c/001_identity_registry.sql \
            database/p2_1c2d4c3/001_registry_service.sql \
            database/p2_1c2d4c4/001_identity_mutation_service.sql; do
            PGDATABASE=echo_identity_mutation_test psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
          PGDATABASE=echo_identity_mutation_test python -m unittest -v \
            backend/p2_1c2d4c4/test_identity_mutation_service.py \
            2>&1 | tee verification/p2_1c2d4c5a/c4-regression.txt
          grep -q 'Ran 20 tests' verification/p2_1c2d4c5a/c4-regression.txt
          grep -q '^OK$' verification/p2_1c2d4c5a/c4-regression.txt
          grep -q 'CLEAN_IDENTITY_MUTATION_DATABASE' verification/p2_1c2d4c5a/c4-regression.txt
      - name: Install account-link proof chain
        run: |
          set -euo pipefail
          for f in \
            database/p2_1b/schema.sql \
            database/p2_1c2c/001_identity_registry.sql \
            database/p2_1c2d4c3/001_registry_service.sql \
            database/p2_1c2d4c4/001_identity_mutation_service.sql \
            database/p2_1c2d4c5a/001_account_link_proof.sql; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done
      - name: Verify durable account-link proof and raw-provision closure
        run: |
          set -euo pipefail
          python -m py_compile backend/p2_1c2d4c5a/test_account_link_proof.py
          python -m unittest -v backend/p2_1c2d4c5a/test_account_link_proof.py \
            2>&1 | tee verification/p2_1c2d4c5a/account-link-proof.txt
          grep -q 'Ran 20 tests' verification/p2_1c2d4c5a/account-link-proof.txt
          grep -q '^OK$' verification/p2_1c2d4c5a/account-link-proof.txt
          grep -q 'CLEAN_ACCOUNT_LINK_PROOF_DATABASE' verification/p2_1c2d4c5a/account-link-proof.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d4c5a-account-link-proof-evidence
          path: verification/p2_1c2d4c5a/
          if-no-files-found: warn
