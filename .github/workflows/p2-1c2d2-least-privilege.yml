name: P2.1c.2d.2 Least Privilege Gate
on:
  push:
    branches: [main]
    paths: ['database/p2_1c2d2/**', '.github/workflows/p2-1c2d2-least-privilege.yml']
  pull_request:
    paths: ['database/p2_1c2d2/**', '.github/workflows/p2-1c2d2-least-privilege.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  least-privilege:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: echo_least_priv_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_least_priv_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: echo_test
      PGPASSWORD: disposable_ci_only
      PGDATABASE: echo_least_priv_test
      ECHO_DISPOSABLE_PG: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare disposable runtime and evidence manifest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install -r backend/p2_1c2c3/requirements.txt
          mkdir -p verification/p2_1c2d2
          git rev-parse HEAD | tee verification/p2_1c2d2/checkout-sha.txt
          sha256sum database/p2_1c2d2/* .github/workflows/p2-1c2d2-least-privilege.yml > verification/p2_1c2d2/source-sha256.txt
          python --version | tee verification/p2_1c2d2/python.txt
          psql -X -Atc 'SELECT version();' | tee verification/p2_1c2d2/postgres.txt
      - name: Compile and run real role boundary suite
        run: |
          set -euo pipefail
          python -m py_compile database/p2_1c2d2/test_least_privilege.py
          python database/p2_1c2d2/test_least_privilege.py 2>&1 | tee verification/p2_1c2d2/least-privilege.txt
          grep -q 'Ran 26 tests' verification/p2_1c2d2/least-privilege.txt
          grep -q '^OK$' verification/p2_1c2d2/least-privilege.txt
          grep -q 'CLEAN_LEAST_PRIVILEGE_DATABASE' verification/p2_1c2d2/least-privilege.txt
      - name: Retain actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d2-least-privilege-evidence
          path: verification/p2_1c2d2/
          if-no-files-found: warn
