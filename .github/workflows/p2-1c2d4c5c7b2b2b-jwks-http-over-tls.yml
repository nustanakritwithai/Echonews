name: P2.1c.2d.4c.5c.7b.2b.2b JWKS HTTP-over-TLS Gate

on:
  push:
    branches: [main]
    paths:
      - 'backend/p2_1c2d4c5c7a/**'
      - 'backend/p2_1c2d4c5c7b2a/**'
      - 'backend/p2_1c2d4c5c7b2b1/**'
      - 'backend/p2_1c2d4c5c7b2b2a/**'
      - 'backend/p2_1c2d4c5c7b2b2b/**'
      - '.github/workflows/p2-1c2d4c5c7b2b2b-jwks-http-over-tls.yml'
  pull_request:
    paths:
      - 'backend/p2_1c2d4c5c7a/**'
      - 'backend/p2_1c2d4c5c7b2a/**'
      - 'backend/p2_1c2d4c5c7b2b1/**'
      - 'backend/p2_1c2d4c5c7b2b2a/**'
      - 'backend/p2_1c2d4c5c7b2b2b/**'
      - '.github/workflows/p2-1c2d4c5c7b2b2b-jwks-http-over-tls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jwks-http-over-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source and runtime
        run: |
          set -euo pipefail
          mkdir -p verification/p2_1c2d4c5c7b2b2b
          git rev-parse HEAD | tee verification/p2_1c2d4c5c7b2b2b/checkout-sha.txt
          python --version | tee verification/p2_1c2d4c5c7b2b2b/python.txt
          sha256sum \
            backend/p2_1c2d4c5c7a/jwks_trust_contract.py \
            backend/p2_1c2d4c5c7a/test_jwks_trust_contract.py \
            backend/p2_1c2d4c5c7b2a/jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2a/test_jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2b1/jwks_egress_guard.py \
            backend/p2_1c2d4c5c7b2b1/test_jwks_egress_guard.py \
            backend/p2_1c2d4c5c7b2b2a/jwks_tls_dialer.py \
            backend/p2_1c2d4c5c7b2b2a/test_jwks_tls_dialer.py \
            backend/p2_1c2d4c5c7b2b2b/README_TH.md \
            backend/p2_1c2d4c5c7b2b2b/jwks_http_tls_fetch.py \
            backend/p2_1c2d4c5c7b2b2b/test_jwks_http_tls_fetch.py \
            | tee verification/p2_1c2d4c5c7b2b2b/source-sha256.txt
      - name: Execute inherited and HTTP-over-TLS contracts
        env:
          PYTHONPATH: backend/p2_1c2d4c5c7a:backend/p2_1c2d4c5c7b2a:backend/p2_1c2d4c5c7b2b1:backend/p2_1c2d4c5c7b2b2a:backend/p2_1c2d4c5c7b2b2b
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/p2_1c2d4c5c7a/jwks_trust_contract.py \
            backend/p2_1c2d4c5c7b2a/jwks_https_transport_contract.py \
            backend/p2_1c2d4c5c7b2b1/jwks_egress_guard.py \
            backend/p2_1c2d4c5c7b2b2a/jwks_tls_dialer.py \
            backend/p2_1c2d4c5c7b2b2b/jwks_http_tls_fetch.py \
            backend/p2_1c2d4c5c7b2b2b/test_jwks_http_tls_fetch.py
          python backend/p2_1c2d4c5c7a/test_jwks_trust_contract.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b2b/trust-contract-tests.txt
          grep -q 'Ran 20 tests' verification/p2_1c2d4c5c7b2b2b/trust-contract-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b2b/trust-contract-tests.txt
          python backend/p2_1c2d4c5c7b2a/test_jwks_https_transport_contract.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b2b/http-envelope-tests.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5c7b2b2b/http-envelope-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b2b/http-envelope-tests.txt
          python backend/p2_1c2d4c5c7b2b1/test_jwks_egress_guard.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b2b/egress-guard-tests.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5c7b2b2b/egress-guard-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b2b/egress-guard-tests.txt
          python backend/p2_1c2d4c5c7b2b2a/test_jwks_tls_dialer.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b2b/tls-dialer-tests.txt
          grep -q 'Ran 16 tests' verification/p2_1c2d4c5c7b2b2b/tls-dialer-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b2b/tls-dialer-tests.txt
          python backend/p2_1c2d4c5c7b2b2b/test_jwks_http_tls_fetch.py \
            2>&1 | tee verification/p2_1c2d4c5c7b2b2b/http-over-tls-tests.txt
          grep -q 'Ran 18 tests' verification/p2_1c2d4c5c7b2b2b/http-over-tls-tests.txt
          grep -q '^OK$' verification/p2_1c2d4c5c7b2b2b/http-over-tls-tests.txt
      - name: Retain HTTP-over-TLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2d4c5c7b2b2b-jwks-http-over-tls-evidence
          path: verification/p2_1c2d4c5c7b2b2b/
          if-no-files-found: warn
