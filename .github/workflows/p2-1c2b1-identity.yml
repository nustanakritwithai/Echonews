name: P2.1c.2b.1 Identity Preflight Gate
on:
  push:
    branches: [main]
    paths: ['backend/p2_1c2b1/**', '.github/workflows/p2-1c2b1-identity.yml']
  pull_request:
    paths: ['backend/p2_1c2b1/**', '.github/workflows/p2-1c2b1-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned direct test dependencies
        run: python -m pip install -r backend/p2_1c2b1/requirements.txt
      - name: Check syntax and real signed-token fixtures
        run: |
          python -m py_compile backend/p2_1c2b1/identity_boundary.py
          python backend/p2_1c2b1/run_checks.py
      - name: Retain evidence without keys or tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-1c2b1-identity-evidence
          path: backend/p2_1c2b1/results/
          if-no-files-found: warn
