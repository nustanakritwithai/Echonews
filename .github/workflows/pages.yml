name: Test and deploy Echo News
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *' # 08:15 Asia/Bangkok; actual start may be delayed by GitHub
permissions:
  contents: read
concurrency:
  group: echo-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact UI source identity
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/checkout-sha.txt
          git ls-files -z index.html app.js style.css core.js data.js preview tests .github/workflows/pages.yml docs/ux scripts/news news | xargs -0 sha256sum > verification/ux-source-sha256.txt
          git archive --format=tar HEAD index.html app.js style.css core.js data.js preview tests .github/workflows/pages.yml docs/ux scripts/news news > verification/ux-source.tar
      - name: Check JavaScript and evidence invariants
        run: |
          set -euo pipefail
          npm run check
          node --check preview/app.mjs
          node --check preview/room-v2.mjs
          node --check preview/evidence-inspector.mjs
          node --check preview/feed-v2.mjs
          npm test 2>&1 | tee verification/main-core.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction and responsive checks
        run: python tests/browser_smoke.py
      - name: Alternative preview core contracts and Room summary
        run: |
          set -euo pipefail
          node --test preview/tests/core.test.mjs 2>&1 | tee verification/preview-core.txt
          node --test preview/tests/room-v2.test.mjs 2>&1 | tee verification/room-v2-unit.txt
          node --test preview/tests/evidence-inspector.test.mjs 2>&1 | tee verification/inspector-unit.txt
          node --test preview/tests/feed-v2.test.mjs 2>&1 | tee verification/feed-v2-unit.txt
      - name: Alternative preview browser integration and Event Feed
        env:
          ECHO_USE_BUNDLED_BROWSER: '1'
        run: |
          set -euo pipefail
          python preview/tests/feed_v2_test.py 2>&1 | tee verification/feed-v2-browser.txt
      - name: Thai news parser and read-only page gates
        env:
          ECHO_USE_BUNDLED_BROWSER: '1'
        run: |
          set -euo pipefail
          python scripts/news/test_collect.py 2>&1 | tee verification/news-unit.txt
          python scripts/news/browser_test.py 2>&1 | tee verification/news-browser.txt
      - name: Update real Thailand source reports on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python scripts/news/collect.py --output _site/news 2>&1 | tee verification/news-collection.txt
      - name: Retain generated news and hash manifest for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: echo-news-build
          path: _site/news/
          retention-days: 30
          if-no-files-found: error
      - name: Keep verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-verification
          path: |
            verification/
            preview/results/
          if-no-files-found: ignore
      - name: Stage only public frontend files
        run: |
          mkdir -p _site/preview
          cp index.html style.css app.js core.js data.js favicon.svg .nojekyll _site/
          cp preview/index.html preview/styles.css preview/app.mjs preview/core.mjs preview/data.mjs preview/icon.svg preview/.nojekyll preview/room-v2.mjs preview/room-v2.css preview/evidence-inspector.mjs preview/evidence-inspector.css preview/feed-v2.mjs preview/feed-v2.css _site/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: echo-news-build
          path: verification/news-build
      - name: Verify published asset content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 tests/verify_published.py
          python3 preview/tests/verify_published.py
          python3 scripts/news/verify_published.py
      - name: Retain public URL verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-published-check
          path: |
            verification/published-site.json
            verification/news-published.json
            preview/results/published-site.json
          if-no-files-found: ignore
