name: Echo Preview - test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: echo-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Core contract tests
        run: node --test tests/core.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser integration under project subpath
        env:
          ECHO_USE_BUNDLED_BROWSER: '1'
        run: python tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: results/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage static files only
        run: |
          mkdir _site
          cp index.html styles.css core.mjs data.mjs app.mjs icon.svg .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
