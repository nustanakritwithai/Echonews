name: Test and deploy Echo News
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: echo-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and evidence invariants
        run: |
          npm run check
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction and responsive checks
        run: python tests/browser_smoke.py
      - name: Keep verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-verification
          path: verification/
          if-no-files-found: ignore
      - name: Stage only public frontend files
        run: |
          mkdir -p _site
          cp index.html style.css app.js core.js data.js favicon.svg .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published asset content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tests/verify_published.py
      - name: Retain public URL verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-published-check
          path: verification/published-site.json
          if-no-files-found: ignore
