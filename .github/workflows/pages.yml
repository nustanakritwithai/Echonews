name: Test and deploy Echo News
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: echo-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact UI source identity
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/checkout-sha.txt
          git ls-files -z index.html app.js style.css core.js data.js preview tests .github/workflows/pages.yml docs/ux | xargs -0 sha256sum > verification/ux-source-sha256.txt
          git archive --format=tar HEAD index.html app.js style.css core.js data.js preview tests .github/workflows/pages.yml docs/ux > verification/ux-source.tar
      - name: Check JavaScript and evidence invariants
        run: |
          set -euo pipefail
          npm run check
          node --check preview/app.mjs
          node --check preview/room-v2.mjs
          npm test 2>&1 | tee verification/main-core.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction and responsive checks
        run: python tests/browser_smoke.py
      - name: Alternative preview core contracts and Room summary
        run: |
          set -euo pipefail
          node --test preview/tests/core.test.mjs 2>&1 | tee verification/preview-core.txt
          node --test preview/tests/room-v2.test.mjs 2>&1 | tee verification/room-v2-unit.txt
      - name: Alternative preview browser integration and Room V2
        env:
          ECHO_USE_BUNDLED_BROWSER: '1'
        run: |
          set -euo pipefail
          python preview/tests/room_v2_test.py 2>&1 | tee verification/room-v2-browser.txt
      - name: Keep verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-verification
          path: |
            verification/
            preview/results/
          if-no-files-found: ignore
      - name: Stage only public frontend files
        run: |
          mkdir -p _site/preview
          cp index.html style.css app.js core.js data.js favicon.svg .nojekyll _site/
          cp preview/index.html preview/styles.css preview/app.mjs preview/core.mjs preview/data.mjs preview/icon.svg preview/.nojekyll preview/room-v2.mjs preview/room-v2.css _site/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published asset content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 tests/verify_published.py
          python3 preview/tests/verify_published.py
      - name: Retain public URL verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-published-check
          path: |
            verification/published-site.json
            preview/results/published-site.json
          if-no-files-found: ignore
